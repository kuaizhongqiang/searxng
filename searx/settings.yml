general:
  debug: false
  instance_name: "AgentWebSearchingTool"
  privacypolicy_url: false
  donation_url: false
  contact_url: false
  enable_metrics: false
  open_metrics: ''

brand:
  docs_url: https://github.com/kuaizhongqiang/AgentWebSearchingTool
  issue_url: https://github.com/kuaizhongqiang/AgentWebSearchingTool/issues

search:
  safe_search: 0
  autocomplete: ""
  autocomplete_min: 4
  favicon_resolver: ""
  default_lang: "auto"
  ban_time_on_fail: 5
  max_ban_time_on_fail: 120
  suspended_times:
    SearxEngineAccessDenied: 180
    SearxEngineCaptcha: 3600
    SearxEngineTooManyRequests: 180
    cf_SearxEngineCaptcha: 1296000
    cf_SearxEngineAccessDenied: 86400
    recaptcha_SearxEngineCaptcha: 604800
  formats:
    - json

server:
  port: 8888
  bind_address: "127.0.0.1"
  base_url: false
  limiter: false
  public_instance: false
  secret_key: "ultrasecretkey"
  image_proxy: false
  http_protocol_version: "1.0"
  method: "POST"
  default_http_headers:
    X-Content-Type-Options: nosniff
    X-Download-Options: noopen
    X-Robots-Tag: noindex, nofollow
    Referrer-Policy: no-referrer

valkey:
  url: false

outgoing:
  request_timeout: 3.0
  useragent_suffix: ""
  pool_connections: 100
  pool_maxsize: 20
  enable_http2: true

ui:
  static_path: ""
  templates_path: ""
  default_theme: simple
  default_locale: ""
  cache_url: ""

categories_as_tabs:
  general:
  images:
  videos:
  news:
  map:
  music:
  it:
  science:
  files:
  social media:

plugins:
  searx.plugins.calculator.SXNGPlugin:
    active: false
  searx.plugins.hash_plugin.SXNGPlugin:
    active: false
  searx.plugins.self_info.SXNGPlugin:
    active: false
  searx.plugins.unit_converter.SXNGPlugin:
    active: false
  searx.plugins.ahmia_filter.SXNGPlugin:
    active: false
  searx.plugins.hostnames.SXNGPlugin:
    active: false
  searx.plugins.time_zone.SXNGPlugin:
    active: false
  searx.plugins.tracker_url_remover.SXNGPlugin:
    active: false
  searx.plugins.infinite_scroll.SXNGPlugin:
    active: false
  searx.plugins.oa_doi_rewrite.SXNGPlugin:
    active: false
  searx.plugins.tor_check.SXNGPlugin:
    active: false

engines:
  # General Web
  - name: duckduckgo
    engine: duckduckgo
    shortcut: ddg
    timeout: 10.0

  - name: google
    engine: google
    shortcut: g
    timeout: 10.0

  - name: bing
    engine: bing
    shortcut: bi
    timeout: 10.0

  - name: brave
    engine: brave
    shortcut: br
    timeout: 10.0

  - name: qwant
    engine: qwant
    shortcut: qw
    timeout: 10.0

  - name: startpage
    engine: startpage
    shortcut: sp
    timeout: 10.0

  - name: wikidata
    engine: wikidata
    shortcut: wd
    timeout: 5.0

  - name: wikipedia
    engine: wikipedia
    shortcut: wp
    timeout: 5.0

  # Images
  - name: bing images
    engine: bing_images
    shortcut: bii
    categories: images
    timeout: 8.0

  - name: google images
    engine: google_images
    shortcut: gim
    categories: images
    timeout: 8.0

  # News
  - name: bing news
    engine: bing_news
    shortcut: bin
    categories: news
    timeout: 8.0

  - name: google news
    engine: google_news
    shortcut: gn
    categories: news
    timeout: 8.0

  # Videos
  - name: youtube noapi
    engine: youtube_noapi
    shortcut: yt
    categories: videos
    timeout: 10.0

  - name: bing videos
    engine: bing_videos
    shortcut: biv
    categories: videos
    timeout: 8.0

  # Science & Academic
  - name: arxiv
    engine: arxiv
    shortcut: arx
    timeout: 8.0

  - name: pubmed
    engine: pubmed
    shortcut: pm
    timeout: 8.0

  - name: semantic scholar
    engine: semantic_scholar
    shortcut: ss
    timeout: 8.0

  - name: crossref
    engine: crossref
    shortcut: cr
    timeout: 8.0

  # Code & Development
  - name: github
    engine: github
    shortcut: gh
    timeout: 8.0

  - name: gitlab
    engine: gitlab
    shortcut: gl
    timeout: 8.0

  - name: pypi
    engine: pypi
    shortcut: py
    timeout: 5.0

  - name: npm
    engine: npm
    shortcut: npm
    timeout: 5.0

  # Map
  - name: openstreetmap
    engine: openstreetmap
    shortcut: osm
    categories: map
    timeout: 8.0
